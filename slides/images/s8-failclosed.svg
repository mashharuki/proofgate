<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 380" width="1180" height="380" font-family="'Hiragino Maru Gothic ProN','Zen Maru Gothic','Hiragino Sans',sans-serif"><defs><linearGradient id="fc-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c35"/><stop offset="1" stop-color="#18181e"/></linearGradient><marker id="fc-ar-g" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#a09aa4"/></marker><marker id="fc-ar-r" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ff6b7d"/></marker><marker id="fc-ar-c" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#00c4e4"/></marker><marker id="fc-ar-ok" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#3ddc97"/></marker><marker id="fc-ar-a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ffb020"/></marker></defs><style>
.fx{transform-box:fill-box;transform-origin:center}
.hold{opacity:0}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes holdout{0%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes arm{from{transform:rotate(-78deg)}to{transform:rotate(0)}}
@keyframes mag{0%{transform:translateY(-180px)}35%{transform:translateY(-180px)}60%{transform:translateY(-90px)}85%,100%{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.bespoke-marp-active .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) var(--d,0s) both}
.bespoke-marp-active .fade{animation:fade .6s ease-out var(--d,0s) both}
.bespoke-marp-active .up{animation:up .6s ease-out var(--d,0s) both}
.bespoke-marp-active .hold{animation:holdout var(--d,1s) linear both}
.bespoke-marp-active .arm{animation:arm 1.1s ease-in var(--d,0s) both}
.bespoke-marp-active .mag{animation:mag 3.2s ease-in-out var(--d,0s) both}
.bespoke-marp-active .grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.bespoke-marp-active .glow{animation:glow 1.6s ease-in-out var(--d,0s) infinite}
.arm{transform-origin:0% 50%}
.grow{transform-box:fill-box;transform-origin:0% 50%}
</style><g class="fx pop" style="--d:0.3s"><rect x="44.0" y="109.0" width="112" height="112" rx="22" fill="url(#fc-tile)" stroke="#3c3c46" stroke-width="2"/><g transform="translate(100 165) scale(1.2)"><path d="M-21 -31 H7 L23 -15 V31 H-21 Z" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round"/><path d="M7 -31 V-15 H23" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round"/><rect x="-11" y="0" width="22" height="4.5" rx="2" fill="#ffffff"/><rect x="-11" y="11" width="22" height="4.5" rx="2" fill="#ffffff"/><rect x="-11" y="22" width="13" height="4.5" rx="2" fill="#ffffff"/></g><text x="100" y="259" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">テンプレート</text></g><g class="fx fade" style="--d:0.9s"><path d="M162 165 C250 165 250 70 350 70" fill="none" stroke="#3ddc97" stroke-width="4" marker-end="url(#fc-ar-ok)"/></g><g class="fx pop" style="--d:1.1s"><rect x="364" y="20" width="796" height="100" rx="26" fill="url(#fc-tile)" stroke="#3ddc97" stroke-width="3"/><text x="400" y="83" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">経路なし</text><rect x="990" y="38" width="150" height="64" rx="32" fill="#1f7a55"/><text x="1065" y="82" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">通す</text></g><g class="fx fade" style="--d:1.6s"><path d="M162 165 C250 165 250 190 350 190" fill="none" stroke="#ff6b7d" stroke-width="4" marker-end="url(#fc-ar-r)"/></g><g class="fx pop" style="--d:1.8s"><rect x="364" y="140" width="796" height="100" rx="26" fill="url(#fc-tile)" stroke="#ff6b7d" stroke-width="3"/><text x="400" y="203" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">経路あり</text><text x="730" y="201" font-family="'SF Mono',Menlo,Monaco,monospace" font-size="24" fill="#a09aa4">PG-IAM-004 / 005</text><rect x="990" y="158" width="150" height="64" rx="32" fill="#b3263a"/><text x="1065" y="202" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">止める</text></g><g class="fx fade" style="--d:2.3s"><path d="M162 165 C250 165 250 310 350 310" fill="none" stroke="#ffb020" stroke-width="4" marker-end="url(#fc-ar-a)"/></g><g class="fx pop" style="--d:2.5s"><rect x="364" y="260" width="796" height="100" rx="26" fill="url(#fc-tile)" stroke="#ffb020" stroke-width="3"/><text x="400" y="323" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">読めない</text><text x="730" y="321" font-family="'SF Mono',Menlo,Monaco,monospace" font-size="24" fill="#a09aa4">PG-IAM-003</text><rect x="990" y="278" width="150" height="64" rx="32" fill="#8a5a00"/><text x="1065" y="322" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">止める</text></g></svg>