<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 6 1180 464" width="1180" height="464" font-family="'Hiragino Maru Gothic ProN','Zen Maru Gothic','Hiragino Sans',sans-serif"><defs><linearGradient id="vf-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c35"/><stop offset="1" stop-color="#18181e"/></linearGradient><marker id="vf-ar-g" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#a09aa4"/></marker><marker id="vf-ar-r" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ff6b7d"/></marker><marker id="vf-ar-c" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#00c4e4"/></marker><marker id="vf-ar-ok" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#3ddc97"/></marker><marker id="vf-ar-a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ffb020"/></marker></defs><style>
.fx{transform-box:fill-box;transform-origin:center}
.hold{opacity:0}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes holdout{0%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes arm{from{transform:rotate(-78deg)}to{transform:rotate(0)}}
@keyframes mag{0%{transform:translateY(-180px)}35%{transform:translateY(-180px)}60%{transform:translateY(-90px)}85%,100%{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.bespoke-marp-active .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) var(--d,0s) both}
.bespoke-marp-active .fade{animation:fade .6s ease-out var(--d,0s) both}
.bespoke-marp-active .up{animation:up .6s ease-out var(--d,0s) both}
.bespoke-marp-active .hold{animation:holdout var(--d,1s) linear both}
.bespoke-marp-active .arm{animation:arm 1.1s ease-in var(--d,0s) both}
.bespoke-marp-active .mag{animation:mag 3.2s ease-in-out var(--d,0s) both}
.bespoke-marp-active .grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.bespoke-marp-active .glow{animation:glow 1.6s ease-in-out var(--d,0s) infinite}
.arm{transform-origin:0% 50%}
.grow{transform-box:fill-box;transform-origin:0% 50%}
</style><g class="fx fade" style="--d:0.3s"><text x="40" y="60" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">ロールを渡して新しく動かす</text></g><rect x="470" y="30" width="480" height="40" rx="20" fill="#2a2830"/><rect class="fx grow" style="--d:0.3s" x="470" y="30" width="470" height="40" rx="20" fill="#00788c"/><g class="fx fade" style="--d:0.8s"><text x="1140" y="64" font-size="44" font-weight="700" fill="#ffffff" text-anchor="end">46/47</text></g><g class="fx fade" style="--d:0.8s"><text x="40" y="138" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">動いているものを書き換える</text></g><rect x="470" y="108" width="480" height="40" rx="20" fill="#2a2830"/><rect class="fx grow" style="--d:0.8s" x="470" y="108" width="131" height="40" rx="20" fill="#4a8a96"/><g class="fx fade" style="--d:1.3s"><text x="1140" y="142" font-size="44" font-weight="700" fill="#ffffff" text-anchor="end">6/22</text></g><g class="fx fade" style="--d:1.3s"><text x="40" y="216" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">ほかの主体に成りすます</text></g><rect x="470" y="186" width="480" height="40" rx="20" fill="#2a2830"/><rect class="fx grow" style="--d:1.3s" x="470" y="186" width="206" height="40" rx="20" fill="#4a8a96"/><g class="fx fade" style="--d:1.8s"><text x="1140" y="220" font-size="44" font-weight="700" fill="#ffffff" text-anchor="end">6/14</text></g><g class="fx fade" style="--d:1.8s"><text x="40" y="294" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">自分の権限を書き換える</text></g><rect x="470" y="264" width="480" height="40" rx="20" fill="#2a2830"/><rect class="fx grow" style="--d:1.8s" x="470" y="264" width="120" height="40" rx="20" fill="#4a8a96"/><g class="fx fade" style="--d:2.3s"><text x="1140" y="298" font-size="44" font-weight="700" fill="#ffffff" text-anchor="end">2/8</text></g><line x1="40" y1="334" x2="1140" y2="334" stroke="#3c3c46" stroke-width="2"/><g class="fx up" style="--d:2.6s"><text x="40" y="392" font-size="28" font-weight="700" fill="#a09aa4" text-anchor="start">全部で</text><text x="1140" y="398" font-size="64" font-weight="700" fill="#7fe3f5" text-anchor="end">60/91</text></g><g class="fx up" style="--d:3.2s"><text x="40" y="456" font-size="26" font-weight="600" fill="#a09aa4" text-anchor="start">未検出31件の内訳: IAMユーザー・グループ11、既存リソースの書き換え16、ほか4</text></g></svg>