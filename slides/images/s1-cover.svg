<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="220" height="180" font-family="'Hiragino Maru Gothic ProN','Zen Maru Gothic','Hiragino Sans',sans-serif"><defs><linearGradient id="cv-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c35"/><stop offset="1" stop-color="#18181e"/></linearGradient><marker id="cv-ar-g" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#a09aa4"/></marker><marker id="cv-ar-r" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ff6b7d"/></marker><marker id="cv-ar-c" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#00c4e4"/></marker><marker id="cv-ar-ok" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#3ddc97"/></marker><marker id="cv-ar-a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ffb020"/></marker></defs><style>
.fx{transform-box:fill-box;transform-origin:center}
.hold{opacity:0}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes holdout{0%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes arm{from{transform:rotate(-78deg)}to{transform:rotate(0)}}
@keyframes mag{0%{transform:translateY(-180px)}35%{transform:translateY(-180px)}60%{transform:translateY(-90px)}85%,100%{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.bespoke-marp-active .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) var(--d,0s) both}
.bespoke-marp-active .fade{animation:fade .6s ease-out var(--d,0s) both}
.bespoke-marp-active .up{animation:up .6s ease-out var(--d,0s) both}
.bespoke-marp-active .hold{animation:holdout var(--d,1s) linear both}
.bespoke-marp-active .arm{animation:arm 1.1s ease-in var(--d,0s) both}
.bespoke-marp-active .mag{animation:mag 3.2s ease-in-out var(--d,0s) both}
.bespoke-marp-active .grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.bespoke-marp-active .glow{animation:glow 1.6s ease-in-out var(--d,0s) infinite}
.arm{transform-origin:0% 50%}
.grow{transform-box:fill-box;transform-origin:0% 50%}
</style><g class="fx pop" style="--d:0.2s"><rect x="30" y="10" width="160" height="160" rx="32" fill="#00788c"/><rect x="58" y="44" width="14" height="92" rx="5" fill="#ffffff"/><rect x="148" y="44" width="14" height="92" rx="5" fill="#ffffff"/></g><g class="fx arm" style="--d:0.9s"><rect x="65" y="80" width="90" height="16" rx="6" fill="#ff6b7d"/></g></svg>