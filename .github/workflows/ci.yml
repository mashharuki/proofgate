name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Set up and build Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: packages/cdk-plugin/lean
          auto-config: false
          build: true
          test: false
          lint: false

      - name: Check code quality
        run: pnpm quality

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
      - name: Demo on one stack (plain synth, rejection, fix, pass)
        run: pnpm demo:fix

      - name: Audit Lean sources
        run: |
          if grep -REn '(^|[^[:alnum:]_])sorry([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' packages/cdk-plugin/lean --include='*.lean'; then
            echo 'Lean sources must not contain sorry or project-defined axioms.' >&2
            exit 1
          fi

      - name: Verify npm package contents
        run: pnpm pack:check

  # 公開版（npm）のProofGateで、同じ4つの手順を流します（spec proofgate-kiroween-submission, R4, R5）。
  # The same four demo steps with the published npm version, so that anyone can see a run of the published package.
  npm-demo:
    name: Demo with the published npm version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROOFGATE_NPM_VERSION: 1.2.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: false
          require-lockfile: true
      - name: Install elan (the Lean toolchain comes from the published package)
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare a copy of the demo stack that uses the npm version
        run: node scripts/prepare-npm-demo.mjs "$RUNNER_TEMP/npm-demo" "$PROOFGATE_NPM_VERSION"
      - name: Install the npm version and build the copy
        working-directory: ${{ runner.temp }}/npm-demo
        run: |
          npm install --no-audit --no-fund
          npx tsc -p tsconfig.json
      - name: Demo on one stack with the npm version (plain synth, rejection, fix, pass)
        run: node scripts/demo-fix.mjs --app-dir "$RUNNER_TEMP/npm-demo"
