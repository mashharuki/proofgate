="#ffffff">∀</text></g><text x="396" y="310" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">Lean 4</text></g><g class="fx pop" style="--d:2.3000000000000003s"><rect x="570" y="274" width="110" height="52" rx="26" fill="#b3263a"/><text x="625" y="309" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">判定</text></g><g class="fx fade" style="--d:2.5s"><line x1="684" y1="300" x2="722" y2="232" stroke="#a09aa4" stroke-width="4" stroke-linecap="round" marker-end="url(#ag-ar-g)"/></g><g class="fx pop" style="--d:2.9s"><circle cx="770" cy="200" r="62" fill="url(#ag-tile)" stroke="#00c4e4" stroke-width="3"/><text x="770" y="210" font-size="26" font-weight="700" fill="#7fe3f5" text-anchor="middle">一致？</text></g><g class="fx fade" style="--d:3.4s"><line x1="824" y1="164" x2="888" y2="112" stroke="#3ddc97" stroke-width="4" stroke-linecap="round" marker-end="url(#ag-ar-ok)"/><line x1="824" y1="236" x2="888" y2="288" stroke="#ffb020" stroke-width="4" stroke-linecap="round" marker-end="url(#ag-ar-a)"/></g><g class="fx pop" style="--d:3.6s"><rect x="892" y="80" width="268" height="64" rx="32" fill="#1f7a55"/><text x="1026" y="121" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">一致 → そのまま</text></g><g class="fx pop" style="--d:4.0s"><rect x="892" y="256" width="268" height="64" rx="32" fill="#8a5a00"/><text x="1026" y="297" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">食い違い → 止める</text><text x="1026" y="352" font-family="'SF Mono',Menlo,Monaco,monospace" font-size="24" fill="#a09aa4" text-anchor="middle">PG-IAM-003</text></g></svg>