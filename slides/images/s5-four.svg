4" rx="12" fill="none" stroke="#00c4e4" stroke-width="5" transform="rotate(-38 -10 0) translate(-2 8)"/><rect x="-10" y="-12" width="40" height="24" rx="12" fill="none" stroke="#00c4e4" stroke-width="5" transform="rotate(-38 10 0) translate(2 -8)"/></g><text x="745" y="232" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">信頼される</text></g><g class="fx fade" style="--d:2.2s"><text x="890" y="152" font-size="40" font-weight="700" fill="#ff6b7d" text-anchor="middle">＋</text></g><g class="fx pop" style="--d:2.3999999999999995s"><rect x="915" y="14" width="240" height="250" rx="34" fill="url(#fo-tile)" stroke="#3c3c46" stroke-width="2"/><circle cx="953" cy="54" r="22" fill="#00788c"/><text x="953" y="63" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><g transform="translate(1035 125) scale(1.7)"><ellipse cx="0" cy="-22" rx="28" ry="9" fill="none" stroke="#00c4e4" stroke-width="4.5"/><path d="M-28 -22 L-22 25 Q0 36 22 25 L28 -22" fill="none" stroke="#00c4e4" stroke-width="4.5" stroke-linejoin="round"/><path d="M-26 -3 Q0 9 26 -3" fill="none" stroke="#00c4e4" stroke-width="4"/></g><text x="1035" y="232" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">届く</text></g><g class="fx pop" style="--d:3.4s"><rect x="140" y="306" width="900" height="72" rx="36" fill="#b3263a"/><text x="190" y="355" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">全部そろうと、権限昇格の経路あり</text><text x="1000" y="353" font-family="'SF Mono',Menlo,Monaco,monospace" font-size="26" fill="#ffd2d8" text-anchor="end">PG-IAM-004</text></g></svg>