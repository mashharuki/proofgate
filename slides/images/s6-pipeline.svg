ght="7" rx="3.5" fill="#ffffff"/><circle cx="-20" cy="18" r="4.5" fill="#ffffff"/><rect x="-9" y="14.5" width="32" height="7" rx="3.5" fill="#ffffff"/></g><text x="730" y="274" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">候補の経路</text></g><g class="fx fade" style="--d:2.3s"><line x1="806" y1="170" x2="954" y2="170" stroke="#00c4e4" stroke-width="5" stroke-linecap="round" marker-end="url(#pl-ar-c)"/></g><g class="fx pop" style="--d:2.7s"><rect x="970.0" y="110.0" width="120" height="120" rx="24" fill="#00788c" stroke="none" stroke-width="2"/><g transform="translate(1030 170) scale(1.3)"><text x="0" y="19" font-size="62" font-weight="700" text-anchor="middle" fill="#ffffff">∀</text></g><text x="1030" y="274" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">証明</text></g><g class="fx fade" style="--d:2.0s"><path d="M370 94 V82 H790 V94" fill="none" stroke="#7fe3f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="58" font-size="26" font-weight="700" fill="#7fe3f5" text-anchor="middle">TypeScript</text></g><g class="fx fade" style="--d:2.9s"><path d="M970 94 V82 H1090 V94" fill="none" stroke="#7fe3f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1030" y="58" font-size="26" font-weight="700" fill="#7fe3f5" text-anchor="middle">Lean 4</text></g></svg>