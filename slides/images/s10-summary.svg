<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 1180 426" width="1180" height="426" font-family="'Hiragino Maru Gothic ProN','Zen Maru Gothic','Hiragino Sans',sans-serif"><defs><linearGradient id="sm-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c35"/><stop offset="1" stop-color="#18181e"/></linearGradient><marker id="sm-ar-g" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#a09aa4"/></marker><marker id="sm-ar-r" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ff6b7d"/></marker><marker id="sm-ar-c" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#00c4e4"/></marker><marker id="sm-ar-ok" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#3ddc97"/></marker><marker id="sm-ar-a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ffb020"/></marker></defs><style>
.fx{transform-box:fill-box;transform-origin:center}
.hold{opacity:0}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes holdout{0%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes arm{from{transform:rotate(-78deg)}to{transform:rotate(0)}}
@keyframes mag{0%{transform:translateY(-180px)}35%{transform:translateY(-180px)}60%{transform:translateY(-90px)}85%,100%{transform:translateY(0)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.bespoke-marp-active .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) var(--d,0s) both}
.bespoke-marp-active .fade{animation:fade .6s ease-out var(--d,0s) both}
.bespoke-marp-active .up{animation:up .6s ease-out var(--d,0s) both}
.bespoke-marp-active .hold{animation:holdout var(--d,1s) linear both}
.bespoke-marp-active .arm{animation:arm 1.1s ease-in var(--d,0s) both}
.bespoke-marp-active .mag{animation:mag 3.2s ease-in-out var(--d,0s) both}
.bespoke-marp-active .glow{animation:glow 1.6s ease-in-out var(--d,0s) infinite}
.arm{transform-origin:0% 50%}
</style><text x="40" y="40" font-size="28" font-weight="700" fill="#7fe3f5" text-anchor="start">ここまでの検査</text><g class="fx up" style="--d:0.3s"><text x="40" y="132" font-size="84" font-weight="700" fill="#ffffff">879</text><text x="40" y="174" font-size="28" font-weight="700" fill="#a09aa4" text-anchor="start">起動アクションを検査</text></g><g class="fx up" style="--d:0.9s"><text x="40" y="264" font-size="84" font-weight="700" fill="#ffffff">60/91</text><text x="40" y="306" font-size="28" font-weight="700" fill="#a09aa4" text-anchor="start">既知の昇格経路を検出</text></g><line x1="600" y1="20" x2="600" y2="322" stroke="#3c3c46" stroke-width="2"/><text x="660" y="40" font-size="28" font-weight="700" fill="#7fe3f5" text-anchor="start">Kiro で作った</text><g class="fx pop" style="--d:1.5s"><rect x="660" y="80" width="240" height="100" rx="38" fill="url(#sm-tile)" stroke="#3c3c46" stroke-width="2"/><g transform="translate(706 130.0) scale(0.85)"><rect x="-22" y="-26" width="44" height="56" rx="7" fill="none" stroke="#00c4e4" stroke-width="4.5"/><rect x="-11" y="-32" width="22" height="12" rx="4" fill="#00c4e4"/><rect x="-12" y="-4" width="24" height="4.5" rx="2" fill="#00c4e4"/><rect x="-12" y="8" width="24" height="4.5" rx="2" fill="#00c4e4"/><rect x="-12" y="20" width="14" height="4.5" rx="2" fill="#00c4e4"/></g><text x="752" y="139.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">spec × 7</text></g><g class="fx pop" style="--d:1.85s"><rect x="920" y="80" width="240" height="100" rx="38" fill="url(#sm-tile)" stroke="#3c3c46" stroke-width="2"/><g transform="translate(966 130.0) scale(0.85)"><circle cx="0" cy="0" r="28" fill="none" stroke="#00c4e4" stroke-width="4.5"/><path d="M0 -17 L8 0 L0 17 L-8 0 Z" fill="#00c4e4" transform="rotate(40)"/></g><text x="1012" y="139.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">steering</text></g><g class="fx pop" style="--d:2.2s"><rect x="660" y="195" width="240" height="100" rx="38" fill="url(#sm-tile)" stroke="#3c3c46" stroke-width="2"/><g transform="translate(706 245.0) scale(0.85)"><circle cx="0" cy="-24" r="6" fill="#00c4e4"/><path d="M0 -18 V10 A13 13 0 0 1 -26 10 M-26 10 L-33 3 M-26 10 L-19 3" fill="none" stroke="#00c4e4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(13 0)"/></g><text x="752" y="254.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">hook</text></g><g class="fx pop" style="--d:2.55s"><rect x="920" y="195" width="240" height="100" rx="38" fill="url(#sm-tile)" stroke="#3c3c46" stroke-width="2"/><g transform="translate(966 245.0) scale(0.85)"><rect x="-14" y="-30" width="7" height="18" rx="3" fill="#00c4e4"/><rect x="7" y="-30" width="7" height="18" rx="3" fill="#00c4e4"/><rect x="-22" y="-14" width="44" height="26" rx="9" fill="none" stroke="#00c4e4" stroke-width="4.5"/><path d="M0 12 V24 Q0 31 -9 31" fill="none" stroke="#00c4e4" stroke-width="4.5" stroke-linecap="round"/></g><text x="1012" y="254.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">MCP</text></g><g class="fx up" style="--d:3.2s"><rect x="250" y="370" width="680" height="68" rx="34" fill="#00788c"/><text x="590" y="415" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">次は ロール連鎖とデータ境界へ</text></g></svg>