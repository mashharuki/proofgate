<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="'Hiragino Maru Gothic ProN','Zen Maru Gothic','Hiragino Sans',sans-serif"><defs><linearGradient id="sm-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c35"/><stop offset="1" stop-color="#18181e"/></linearGradient><marker id="sm-ar-g" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#a09aa4"/></marker><marker id="sm-ar-r" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ff6b7d"/></marker><marker id="sm-ar-c" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#00c4e4"/></marker><marker id="sm-ar-ok" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#3ddc97"/></marker><marker id="sm-ar-a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ffb020"/></marker></defs><style>
.fx{transform-box:fill-box;transform-origin:center}
.hold{opacity:0}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes holdout{0%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes arm{from{transform:rotate(-78deg)}to{transform:rotate(0)}}
@keyframes mag{0%{transform:translateY(-180px)}35%{transform:translateY(-180px)}60%{transform:translateY(-90px)}85%,100%{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.bespoke-marp-active .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) var(--d,0s) both}
.bespoke-marp-active .fade{animation:fade .6s ease-out var(--d,0s) both}
.bespoke-marp-active .up{animation:up .6s ease-out var(--d,0s) both}
.bespoke-marp-active .hold{animation:holdout var(--d,1s) linear both}
.bespoke-marp-active .arm{animation:arm 1.1s ease-in var(--d,0s) both}
.bespoke-marp-active .mag{animation:mag 3.2s ease-in-out var(--d,0s) both}
.bespoke-marp-active .grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.bespoke-marp-active .glow{animation:glow 1.6s ease-in-out var(--d,0s) infinite}
.arm{transform-origin:0% 50%}
.grow{transform-box:fill-box;transform-origin:0% 50%}
</style><text x="40" y="40" font-size="28" font-weight="700" fill="#7fe3f5" text-anchor="start">まだ対象外</text><g class="fx up" style="--d:0.3s"><rect x="40" y="80" width="340" height="150" rx="20" fill="none" stroke="#3c3c46" stroke-width="2"/><text x="210" y="168" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">SCP</text></g><g class="fx up" style="--d:0.9s"><rect x="420" y="80" width="340" height="150" rx="20" fill="none" stroke="#3c3c46" stroke-width="2"/><text x="590" y="168" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">権限境界</text></g><g class="fx up" style="--d:1.5s"><rect x="800" y="80" width="340" height="150" rx="20" fill="none" stroke="#3c3c46" stroke-width="2"/><text x="970" y="168" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">ロールの連鎖</text></g><g class="fx up" style="--d:2.4s"><rect x="250" y="300" width="680" height="68" rx="34" fill="#00788c"/><text x="590" y="345" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">次は ロール連鎖とデータ境界へ</text></g><g class="fx fade" style="--d:3.0s"><text x="590" y="440" font-family="'SF Mono',Menlo,Monaco,monospace" font-size="28" fill="#7fe3f5" text-anchor="middle">github.com/mashharuki/proofgate</text></g></svg>