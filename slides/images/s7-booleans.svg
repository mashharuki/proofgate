<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 370" width="1180" height="370" font-family="'Hiragino Maru Gothic ProN','Zen Maru Gothic','Hiragino Sans',sans-serif"><defs><linearGradient id="bl-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c35"/><stop offset="1" stop-color="#18181e"/></linearGradient><marker id="bl-ar-g" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#a09aa4"/></marker><marker id="bl-ar-r" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ff6b7d"/></marker><marker id="bl-ar-c" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#00c4e4"/></marker><marker id="bl-ar-ok" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#3ddc97"/></marker><marker id="bl-ar-a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0 1 L18 10 L0 19 Z" fill="#ffb020"/></marker></defs><style>
.fx{transform-box:fill-box;transform-origin:center}
.hold{opacity:0}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes holdout{0%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes arm{from{transform:rotate(-78deg)}to{transform:rotate(0)}}
@keyframes mag{0%{transform:translateY(-180px)}35%{transform:translateY(-180px)}60%{transform:translateY(-90px)}85%,100%{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.bespoke-marp-active .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) var(--d,0s) both}
.bespoke-marp-active .fade{animation:fade .6s ease-out var(--d,0s) both}
.bespoke-marp-active .up{animation:up .6s ease-out var(--d,0s) both}
.bespoke-marp-active .hold{animation:holdout var(--d,1s) linear both}
.bespoke-marp-active .arm{animation:arm 1.1s ease-in var(--d,0s) both}
.bespoke-marp-active .mag{animation:mag 3.2s ease-in-out var(--d,0s) both}
.bespoke-marp-active .grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.bespoke-marp-active .glow{animation:glow 1.6s ease-in-out var(--d,0s) infinite}
.arm{transform-origin:0% 50%}
.grow{transform-box:fill-box;transform-origin:0% 50%}
</style><text x="40" y="105" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">渡せる</text><g class="hold" style="--d:0.6s"><rect x="300" y="65" width="130" height="60" rx="30" fill="#3a3640"/><text x="365" y="104" font-size="26" font-weight="700" fill="#a09aa4" text-anchor="middle">false</text></g><g class="fx pop" style="--d:0.6s"><rect x="300" y="65" width="130" height="60" rx="30" fill="#b3263a"/><text x="365" y="104" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">true</text></g><line x1="440" y1="95" x2="560" y2="95" stroke="#3c3c46" stroke-width="4"/><text x="40" y="175" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">起動できる</text><g class="hold" style="--d:1.2999999999999998s"><rect x="300" y="135" width="130" height="60" rx="30" fill="#3a3640"/><text x="365" y="174" font-size="26" font-weight="700" fill="#a09aa4" text-anchor="middle">false</text></g><g class="fx pop" style="--d:1.2999999999999998s"><rect x="300" y="135" width="130" height="60" rx="30" fill="#b3263a"/><text x="365" y="174" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">true</text></g><line x1="440" y1="165" x2="560" y2="165" stroke="#3c3c46" stroke-width="4"/><text x="40" y="245" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">信頼される</text><g class="hold" style="--d:2.0s"><rect x="300" y="205" width="130" height="60" rx="30" fill="#3a3640"/><text x="365" y="244" font-size="26" font-weight="700" fill="#a09aa4" text-anchor="middle">false</text></g><g class="fx pop" style="--d:2.0s"><rect x="300" y="205" width="130" height="60" rx="30" fill="#b3263a"/><text x="365" y="244" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">true</text></g><line x1="440" y1="235" x2="560" y2="235" stroke="#3c3c46" stroke-width="4"/><text x="40" y="315" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">届く</text><g class="hold" style="--d:2.6999999999999997s"><rect x="300" y="275" width="130" height="60" rx="30" fill="#3a3640"/><text x="365" y="314" font-size="26" font-weight="700" fill="#a09aa4" text-anchor="middle">false</text></g><g class="fx pop" style="--d:2.6999999999999997s"><rect x="300" y="275" width="130" height="60" rx="30" fill="#b3263a"/><text x="365" y="314" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">true</text></g><line x1="440" y1="305" x2="560" y2="305" stroke="#3c3c46" stroke-width="4"/><path d="M560 60 H645 A135 135 0 0 1 645 330 H560 Z" fill="url(#bl-tile)" stroke="#00c4e4" stroke-width="3"/><text x="640" y="207" font-size="34" font-weight="700" fill="#00c4e4" text-anchor="middle">AND</text><line x1="780" y1="195" x2="826" y2="195" stroke="#3c3c46" stroke-width="4"/><g class="hold" style="--d:3.4s"><rect x="830" y="135" width="330" height="120" rx="26" fill="#1f7a55"/><text x="995" y="214" font-size="50" font-weight="700" fill="#ffffff" text-anchor="middle">SAFE</text></g><g class="fx pop" style="--d:3.4s"><rect x="830" y="135" width="330" height="120" rx="26" fill="#b3263a"/><text x="995" y="214" font-size="50" font-weight="700" fill="#ffffff" text-anchor="middle">UNSAFE</text></g></svg>